review:
  upload:
    enabled: false # 是否允许执行 report 上传
    # apiUrl / apiKey 已迁移到 webhook.url / webhook.token；旧字段保留兼容读取，不推荐使用
    timeoutSeconds: 30 # HTTP 请求超时时间（秒）
    webhook: # 主上报目标配置 + Webhook 推送配置容器
      enabled: false # 是否启用上传 / v2 推送
      url: "https://xiaoniu.tech/api/stock/reviews" # 主上报目标（默认 xiaoniu；可通过 set-webhook-url 改）
      token: "" # 主上报 Bearer Token；空=走环境变量 STOCK_REVIEW_WEBHOOK_TOKEN；可通过 set-webhook-token 写入
      secret: "" # HMAC-SHA256 签名密钥（v2 推送触发实现后启用）；可通过 set-webhook-secret 写入
      maxRetries: 3 # v2 推送失败重试次数；推送触发实现后生效
  local:
    doc:
      enabled: true # 是否启用本地存储复盘文档
      path: "/usr/local/files/docs/stock" # 复盘文档目录
    json:
      enabled: true # 是否启用本地存储复盘 JSON
      path: "/usr/local/files/docs/stock" # 复盘 JSON 目录
